<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Verve</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-toggles">
        <button class="toggle-btn" id="dir-toggle" title="Toggle RTL/LTR"
            style="background: var(--bg-secondary);">LTR</button>
        <button class="toggle-btn" id="theme-toggle" title="Toggle Dark/Light Mode"
            style="background: var(--bg-secondary);">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>
    <div style="display: flex; min-height: 100vh; background: var(--bg-primary);">
        <div class="auth-bg"
            style="flex: 1; background: url('https://images.unsplash.com/photo-1532012197267-da84d127e765?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;">
        </div>
        <div
            style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem;">
            <div
                style="width: 100%; max-width: 450px; background: var(--bg-secondary); padding: 3rem; border-radius: var(--border-radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);">
                <div class="text-center" style="margin-bottom: 2rem;">
                    <a href="index.html" class="logo" style="justify-content: center;">
                        <svg class="verve-logo-svg" width="36" height="36" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#722f37" /><stop offset="100%" stop-color="#581845" /></linearGradient><linearGradient id="logo-accent" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c7a17a" /><stop offset="100%" stop-color="#a67c52" /></linearGradient></defs><path d="M50 10 A 40 40 0 1 0 90 50" fill="none" stroke="url(#logo-grad)" stroke-width="12" stroke-linecap="round"/><path d="M25 35 L50 85 L85 15" fill="none" stroke="url(#logo-accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Verve<span>.</span>
                    </a>
                    <h2 style="margin-top: 1rem;">Create an Account</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Start your language immersion journey today.
                    </p>
                </div>


                <form>
                    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                        <div style="flex: 1;">
                            <label
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">First
                                Name</label>
                            <input type="text" placeholder="John"
                                style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-main); outline: none;"
                                required>
                        </div>
                        <div style="flex: 1;">
                            <label
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Last
                                Name</label>
                            <input type="text" placeholder="Doe"
                                style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-main); outline: none;"
                                required>
                        </div>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Email
                            Address</label>
                        <input type="email" placeholder="john@example.com"
                            style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-main); outline: none;"
                            required>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Password</label>
                        <input type="password" placeholder="Create a password"
                            style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-main); outline: none;"
                            required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </form>

                <div style="display: flex; align-items: center; margin: 2rem 0;">
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    <span style="padding: 0 1rem; color: var(--text-muted); font-size: 0.9rem;">or continue with</span>
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <button class="btn btn-outline" style="justify-content: center; gap: 0.5rem;"><i class="fa-brands fa-google"></i> Google</button>
                    <button class="btn btn-outline" style="justify-content: center; gap: 0.5rem;"><i class="fa-brands fa-apple"></i> Apple</button>
                    <button class="btn btn-outline" style="justify-content: center; gap: 0.5rem;"><i class="fa-brands fa-facebook" style="color: #1877F2;"></i> Facebook</button>
                    <button class="btn btn-outline" style="justify-content: center; gap: 0.5rem;"><i class="fa-brands fa-microsoft" style="color: #00a4ef;"></i> Microsoft</button>
                </div>

                <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? <a href="sign-in.html"
                        style="color: var(--primary-color); font-weight: 600;">Sign In</a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
